; HomecoreOS Isolated ESP8266 Build Configuration (NodeMCU v2 / ESP-12E)
; Separate from ESP-IDF v5.x firmware/CMakeLists.txt

[env:nodemcu-esp8266]
platform = espressif8266@^4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.f_flash = 40000000L
build_flags =
    -DHOMECORE_BOARD_SLUG=\"nodemcu-esp8266\"
    -DHOMECORE_FW_VERSION=\"1.2.0\"
    -DHOMECORE_I2C_DEFAULT_SDA_GPIO=4
    -DHOMECORE_I2C_DEFAULT_SCL_GPIO=5
    -DHOMECORE_ADC_PIN=17
    -DHOMECORE_HAS_BLE=0
    -I../main
build_src_filter =
    +<*>
    +<../../main/sensor_driver_logic.c>
    +<../../main/io_state_logic.c>
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    knolleary/PubSubClient@^2.8
