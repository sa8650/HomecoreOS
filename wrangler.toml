# HomecoreOS — Cloudflare Pages configuration.
#
# The owner does NOT edit this file to configure the platform. In the
# Cloudflare Dashboard: Workers & Pages -> Pages project -> Settings:
#   Bindings            -> D1 database named `DB`
#                       -> R2 bucket named `FIRMWARE_BUCKET`
#   Variables and Secrets -> encrypted `SECRETS_KEY` (64 hex chars)
# Then Save and redeploy. No R2 access keys, D1 API tokens or database URLs.
#
# For Supabase instead set SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY as
# bootstrap variables and apply supabase/migrations once (see DEPLOYMENT.md).
name = "homecoreos"
pages_build_output_dir = "apps/web/dist"
compatibility_date = "2024-11-08"
# No Node compatibility flag needed: the API uses Web APIs only.

[vars]
# No database provider is hardcoded here: the runtime detects the one active
# provider from the `DB` binding or the Supabase bootstrap variables.
