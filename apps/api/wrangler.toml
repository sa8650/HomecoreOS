# ============================================================================
# OPTIONAL standalone Worker — ONLY for the advanced MQTT-over-WSS Durable
# Object ingress bridge. The normal deployment is Cloudflare Pages Functions
# (root `functions/[[path]].ts` + root `wrangler.toml`) and needs no Worker.
#
# Configure bindings/secrets in the Cloudflare dashboard, not in this file:
#   D1 database named DB (or SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY)
#   R2 bucket named FIRMWARE_BUCKET
#   encrypted SECRETS_KEY (64 hex chars)
# All EMQX / remaining Supabase values are entered in the Owner Console and
# encrypted in platform_secrets. No API keys or credentials are hardcoded here.
# ============================================================================
name = "homecoreos-mqtt-bridge"
main = "src/worker.ts"
compatibility_date = "2024-11-08"

# No nodejs_compat flag: the API uses Web APIs only. No database provider is
# hardcoded — the runtime detects exactly one from the binding/bootstrap vars.
[vars]
INGRESS_INSTANCE = "primary"

[[durable_objects.bindings]]
name = "MQTT_INGRESS"
class_name = "MqttIngressDO"

[[migrations]]
tag = "v1"
new_classes = ["MqttIngressDO"]

[[r2_buckets]]
binding = "FIRMWARE_BUCKET"
bucket_name = "homecoreos-firmware"

[triggers]
crons = ["0 * * * *"]
