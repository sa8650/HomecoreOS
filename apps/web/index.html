<!doctype html>
<html lang="en" dir="ltr" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HomecoreOS — Smart Home Automation Platform</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        if (localStorage.getItem("homecoreos:theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch {}
    </script>
  </head>
  <body class="min-h-full bg-background text-foreground font-sans selection:bg-primary/15 selection:text-primary">
    <div id="root" class="min-h-screen"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
