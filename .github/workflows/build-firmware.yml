name: Build HomecoreOS ESP32 Firmware

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/build-firmware.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Firmware semantic version (e.g. 1.2.0)"
        required: true
        default: "1.2.0"
      channel:
        description: "Release channel"
        required: true
        type: choice
        options:
          - stable
          - beta
          - development
        default: "stable"
      board_slug:
        description: "Target board slug or 'all'"
        required: true
        default: "all"

jobs:
  verify-host-tests-and-profiles:
    name: Host C Tests, Board Overlays & Isolated ESP8266 Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run host-compilable firmware C logic unit tests
        shell: bash
        run: |
          set -eu
          gcc -Wall -Wextra -Werror -std=c11 firmware/test/test_io_state_logic.c firmware/main/io_state_logic.c -o /tmp/test_io_state_logic && /tmp/test_io_state_logic
          gcc -Wall -Wextra -Werror -std=c11 firmware/test/test_ota_boot_logic.c firmware/main/ota_boot_logic.c -o /tmp/test_ota_boot_logic && /tmp/test_ota_boot_logic
          gcc -Wall -Wextra -Werror -std=c11 firmware/test/test_provisioning_logic.c firmware/main/provisioning_logic.c -o /tmp/test_provisioning_logic && /tmp/test_provisioning_logic
          gcc -Wall -Wextra -Werror -std=c11 firmware/test/test_sensor_driver_logic.c firmware/main/sensor_driver_logic.c -lm -o /tmp/test_sensor_driver_logic && /tmp/test_sensor_driver_logic
          gcc -Wall -Wextra -Werror -std=c11 firmware/test/test_role_logic.c firmware/main/role_logic.c -o /tmp/test_role_logic && /tmp/test_role_logic

      - name: Verify board overlays, driver manifest verifier & ESP8266 isolation
        shell: bash
        run: |
          set -eu
          python3 firmware/scripts/verify_firmware_image.py --verify-board-overlays firmware/boards
          python3 firmware/scripts/verify_firmware_image.py --verify-esp8266-profile firmware/esp8266/board-profile.json
          python3 -m unittest -v firmware/scripts/test_verify_firmware_image.py

  prepare-matrix:
    name: Resolve Firmware Build Matrix
    needs: verify-host-tests-and-profiles
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      version: ${{ steps.set-matrix.outputs.version }}
      channel: ${{ steps.set-matrix.outputs.channel }}
    steps:
      - name: Generate board matrix JSON
        id: set-matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BOARD_SLUG: ${{ github.event.inputs.board_slug || '' }}
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel || '' }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
