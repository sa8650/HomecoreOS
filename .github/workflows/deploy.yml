name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: helios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify board catalog is in sync
        run: |
          node scripts/board-catalog.mjs
          git diff --exit-code -- packages/core/data/board-catalog.json supabase/migrations/0008_board_catalog.sql
      - name: Upload Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: helios-web
          path: apps/web/dist

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Deploy Worker
        working-directory: apps/api
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build frontend
        run: npm run build -w apps/web
      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=helios-web
      # Database migrations are change-controlled: run `supabase db push`
      # from a maintenance step after enabling SUPABASE_ACCESS_TOKEN, or apply
      # supabase/migrations/*.sql in order with psql. Never auto-run on every push.
