name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Build Pages Functions
        run: npx wrangler pages functions build --outdir /tmp/homecoreos-pages-worker --compatibility-date 2024-11-08
      - name: Reject Node built-ins in the Pages bundle
        run: |
          if grep -rq 'node:' /tmp/homecoreos-pages-worker; then
            echo "Pages Functions bundle imports Node built-ins"
            exit 1
          fi
